name: bcs-hook-operator
displayName: Hook-Operator
description: Hook-Operator 支持优雅删除/更新的 hook 检查
chartInfo:
  chartName: bcs-hook-operator
  releaseName: hook-operator
  defaultNamespace: bcs-system
  exampleValues: |
    command:
      - ./bcs-hook-operator
      - --concurrent-hook-syncs=1
    DeleteProtectEnable: true
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1
        memory: 512Mi
requiredForAppTypes:
  # trpc / taf 为旧登记值，已废弃
  - trpc
  - taf
  - bkmsApp
optionalForAppTypes: []
unsupportedOnFederation: true
