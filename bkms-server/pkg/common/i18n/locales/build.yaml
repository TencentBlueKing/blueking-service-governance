# 构建（pkg/build）

# 镜像构建（build/build）
BUILD_BUILD_INVALID_CODE_REVISION:
  zh: "代码修订参数不合法（Commit ID 须为 7~40 位十六进制字符）"
  en: "Invalid code revision (Commit ID must be 7-40 hexadecimal characters)"
BUILD_BUILD_CONFIG_NOT_FOUND:
  zh: "应用 {{.appID}} 尚未配置构建信息"
  en: "Build config not found for app {{.appID}}"
BUILD_BUILD_INVALID_IMAGE_REFERENCE:
  zh: "平台构建基础镜像引用无效或镜像版本不存在"
  en: "Platform build base image reference is invalid or image tag does not exist"
BUILD_BUILD_PLATFORM_IMAGES_INVALID:
  zh: "平台构建镜像配置不合法"
  en: "Platform build image configuration is invalid"
BUILD_BUILD_IMAGE_CREDENTIAL_MISSING:
  zh: "工作空间镜像仓库凭证缺失，请先完善镜像源配置"
  en: "Workspace image registry credential is missing, please configure it first"
BUILD_BUILD_CODE_REVISION_REQUIRED:
  zh: "请指定代码修订版本（分支、Tag 或 Commit ID）"
  en: "Code revision (branch, tag, or commit ID) is required"
BUILD_BUILD_CUSTOM_TAG_PREFIX_TOO_LONG:
  zh: "自定义 Tag 前缀长度不能超过 {{.max}} 个字符"
  en: "Custom tag prefix must be at most {{.max}} characters"
BUILD_BUILD_CUSTOM_TAG_EMPTY:
  zh: "自定义 Tag 至少需要包含前缀、代码版本或构建时间中的一项"
  en: "Custom tag must have at least one of: prefix, withRevision, withBuildTime"
BUILD_BUILD_IMAGE_FIELD_REQUIRED:
  zh: "镜像配置不能为空"
  en: "Image field is required"
BUILD_BUILD_INVALID_IMAGE_CREDENTIALS:
  zh: "镜像仓库用户名和密码必须同时为空或同时填写"
  en: "Username and password must both be empty or both have values"
BUILD_BUILD_CODE_REPO_FIELD_REQUIRED:
  zh: "代码仓库配置不能为空"
  en: "Code repository field is required"
BUILD_BUILD_INVALID_CODE_REPO_CONFIG:
  zh: "代码仓库构建配置不合法"
  en: "Invalid code repository build config"
BUILD_BUILD_PIPELINE_FIELD_REQUIRED:
  zh: "流水线配置不能为空"
  en: "Pipeline field is required"
BUILD_BUILD_INVALID_SOURCE_TYPE:
  zh: "不支持的构建来源类型"
  en: "Invalid build source type"
BUILD_BUILD_RECORD_NOT_FOUND:
  zh: "未找到构建记录"
  en: "Build record not found"
BUILD_BUILD_BKCI_PROJECT_NOT_FOUND:
  zh: "未找到工作空间对应的蓝盾项目"
  en: "BKCI project not found for workspace"

