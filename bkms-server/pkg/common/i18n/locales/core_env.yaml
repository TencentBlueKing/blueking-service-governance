cluster_addon.uninstallSuccess:
  zh: "插件卸载成功"
  en: "addon uninstalled successfully"

cluster_addon.addon.agones.description:
  zh: "Agones 是 Kubernetes 上的游戏服务器管理器，用于管理游戏服务器实例的部署、伸缩和调度。"
  en: "Agones is a Kubernetes-based game server manager for deploying, scaling, and scheduling game server instances."
cluster_addon.addon.agones.exampleValues:
  zh: |-
    agones:
      image:
        registry: mirrors.tencent.com/bkms
      gameservers:
        # 需要部署的游戏服务器所在的命名空间, 与环境的命名空间一致, 可配置多个
        namespaces: [default]
        # 游戏服务器实例的端口范围
        minPort: 8000
        maxPort: 8010
      controller:
        # Controller 实例数量
        replicas: 2
        # Worker 数量
        numWorkers: 100
        # 访问 API Server 的 QPS 和 QPS burst
        apiServerQPS: 400
        apiServerQPSBurst: 500
      allocator:
        # Allocator 实例数量
        replicas: 3
  en: |-
    agones:
      image:
        registry: mirrors.tencent.com/bkms
      gameservers:
        # Namespaces where game servers are deployed; must match the environment namespace (supports multiple)
        namespaces: [default]
        # Port range for game server instances
        minPort: 8000
        maxPort: 8010
      controller:
        # Number of Controller replicas
        replicas: 2
        # Number of workers
        numWorkers: 100
        # QPS and QPS burst for accessing API Server
        apiServerQPS: 400
        apiServerQPSBurst: 500
      allocator:
        # Number of Allocator replicas
        replicas: 3
cluster_addon.addon.bcs-gamedeployment-operator.description:
  zh: "GameDeployment-Operator 支持优雅删除/更新，原地更新及智能化地分步骤灰度发布功能"
  en: "GameDeployment-Operator supports graceful deletion/update, in-place update, and intelligent phased canary release."
cluster_addon.addon.bcs-hook-operator.description:
  zh: "Hook-Operator 支持优雅删除/更新的 hook 检查"
  en: "Hook-Operator supports hook checks for graceful deletion and update."
cluster_addon.addon.bcs-ingress-controller.description:
  zh: "蓝鲸容器服务扩展 Ingress，多云环境下为 GameServer 提供灵活的流量接入方式"
  en: "BCS extended Ingress providing flexible traffic routing for GameServers in multi-cloud environments."
cluster_addon.addon.bcs-ingress-controller.exampleValues:
  zh: |-
    # 腾讯云地域，设置为 Kubernetes 集群所在地域
    tencentcloudRegion: ap-shenzhen
    # 经过 Base64 编码的腾讯云 AccessID
    # echo -n "<SECRET_ID>" | base64
    tencentcloudSecretID: xxx
    # 经过 Base64 编码的腾讯云 AccessKey
    # echo -n "<SECRET_ID>" | base64
    tencentcloudSecretKey: xxx
  en: |-
    # tencent cloud region, set as k8s cluster region
    tencentcloudRegion: ap-shenzhen
    # tencent cloud AccessID after Base64 encoding.
    # echo -n "<SECRET_ID>" | base64
    tencentcloudSecretID: xxx
    # tencent cloud AccessKeyafter Base64 encoding.
    # echo -n "<SECRET_ID>" | base64
    tencentcloudSecretKey: xxx
cluster_addon.addon.bcs-polaris-operator.description:
  zh: "BcsPolaris-Operator 是基于北极星名字服务（Polaris）提供实例自动发现、实例注册与卸载、名字服务管理等功能的组件"
  en: "BcsPolaris-Operator provides automatic instance discovery, registration/deregistration, and service naming management based on Polaris."
cluster_addon.addon.general-pod-autoscaler.description:
  zh: "GeneralPodAutoscaler 支持更多模式自动扩缩副本数"
  en: "GeneralPodAutoscaler supports more modes for automatic replica autoscaling."
