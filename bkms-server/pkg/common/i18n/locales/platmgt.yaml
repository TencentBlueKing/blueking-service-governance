# 平台管理（pkg/platmgt）
PLATMGT_ADMIN_PERMISSION_REQUIRED:
  zh: "需要平台管理员权限"
  en: "Platform administrator permission required"
PLATMGT_ADMIN_INVALID_ROLE_CODE:
  zh: "平台管理员角色编码不合法"
  en: "Invalid platform administrator role code"
PLATMGT_ADMIN_ROLE_BINDING_EXISTS:
  zh: "该用户的平台管理员角色绑定已存在"
  en: "Platform administrator role binding already exists"

PLATMGT_WORKSPACE_ADMIN_ALREADY_EXISTS:
  zh: "已拥有该工作空间的管理员权限"
  en: "Workspace administrator permission already exists"
PLATMGT_WORKSPACE_ADMIN_NOT_FOUND:
  zh: "未找到该工作空间的管理员权限"
  en: "Workspace administrator permission not found"
PLATMGT_TEMP_ADMIN_ALREADY_EXISTS:
  zh: "已存在有效的临时管理员授权"
  en: "Temporary administrator grant already exists"

PLATMGT_IMAGE_REGISTRY_INVALID_ADDRESS:
  zh: "镜像仓库地址不合法，应为不含协议前缀的 host/namespace"
