  en: "Builtin image registry not found"
PLATMGT_IMAGE_REGISTRY_AUTH_FAILED:
  zh: "镜像仓库认证失败或缺少推送权限"
  en: "Image registry authentication failed or push permission denied"
PLATMGT_IMAGE_REGISTRY_NAMESPACE_INACCESSIBLE:
  zh: "镜像仓库命名空间不存在或无权访问"
  en: "Image registry namespace does not exist or is inaccessible"
PLATMGT_IMAGE_REGISTRY_UNREACHABLE:
  zh: "镜像仓库不可达"
  en: "Image registry is unreachable"
PLATMGT_IMAGE_REGISTRY_CREDENTIAL_CREATE_FAILED:
  zh: "创建蓝盾镜像凭证失败"
  en: "Failed to create BKCI image credential"

