<taf>
  <application>
    <server>
      app=${BKMS_ENV_NAME}
      server=${BKMS_APP_NAME}
      localip=${BKMS_POD_IP}
      logpath=/usr/local/taf/log
      timeout=3000
      <${BKMS_ENV_NAME}.${BKMS_APP_NAME}.GreeterObjAdapter>
        endpoint=tcp -h ${BKMS_POD_IP} -p 8080 -t 60000
        servant=${BKMS_ENV_NAME}.${BKMS_APP_NAME}.GreeterObj
        threads=4
        maxconns=10000
        queuecap=10000
        queuetimeout=60000
      </${BKMS_ENV_NAME}.${BKMS_APP_NAME}.GreeterObjAdapter>
    </server>
  </application>
</taf>
