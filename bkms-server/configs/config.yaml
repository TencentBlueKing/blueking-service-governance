# ------------------------------ 蓝鲸平台接入 ------------------------------
# 蓝鲸应用配置（可从开发者中心获取）
bkApp:
  # 应用 Code
  code: bkms
  # 应用 Secret
  secret: masked
# Account 用户账号认证与用户 Token 获取相关配置项集合
account:
  # AuthBaseURL 是 auth 服务的基础 URL，通常由蓝鲸网关服务提供，usertoken 令牌相关功能使用
  authBaseURL: http://apigw.example.com
  # LoginURL 是蓝鲸登录服务的基础 URL，auth 令牌认证、usertoken 拼接登录地址时会用到
  loginURL: http://login.example.com
  # AuthEnvName 是用户 token 使用的环境，不同环境的 token 互相隔离，默认值为 "prod"
  # authEnvName: prod
  # BackendType 是用户认证使用的后端类型，比如 bk_ticket 或 bk_token，默认值为 "bk_token"
  # backendType: bk_token
# 蓝鲸平台地址配置
bkPlatUrls:
  # 蓝鲸网关 API 地址模板
  bkApiUrlTmpl: https://{api_name}.apigw.example.com
  # 组件 API 基础地址
  compApiBaseUrl: https://api.example.com
# 蓝鲸 API 环境配置
bkApiStages:
  # BSCP
  bscp: prod
  # BkCI
  bkci: prod
  # BCS
  bcs: prod
  # KubeInsight
  kubeinsight: prod
  # 蓝鲸 cmdb
  bkcc: prod
  # 海垒
  bkhcm: prod
  # IAM 蓝鲸权限中心
  bkiam: prod
  # DBM 数据库管理平台
  bkdbm: prod
# IAM 中业务系统 ID 配置
bkIAMSystemIDs:
  bkms: bkms
  bkci: bkci
  bcs: bcs
  bkmonitor: bkmonitor
  bklog: bklog
  bkrepo: bkrepo
  bscp: bk_bscp
  bkcc: bkcc
# ------------------------------ 外部依赖服务（蓝鲸 SaaS & 公司系统） ------------------------------
# BCS 配置，由于管理 BCS 集群内的资源
bcs:
  baseUrl: https://bcs-api.example.com
  token: masked
# 蓝盾配置，用于项目初始化 & 流水线模板加载
bkci:
  # 流水线模板存放目录
  pipelineTmpl:
    baseDir: /app/assets/pipeline_templates
    # 流水线模板使用的构建机镜像标识，为空时由 bkci 模板加载逻辑决定默认值
    builderImageCode: "tlinux3_ci"
    # 流水线模板使用的构建机镜像版本，为空时由 bkci 模板加载逻辑决定默认值
    builderImageVersion: "2.*"
# 蓝盾制品库配置，用于项目 & 仓库初始化
bkrepo:
  baseUrl: https://bkrepo.example.com
  # 管理账号配置，需由制品库管理员提供
  username: bkms
  password: <masked>
  # 仓库初始化配置
  initRepos:
    - name: repo
      type: DOCKER
      isPublic: false
      description: "蓝鲸服务治理 docker 镜像源仓库"
      endpointTmpl: "docker.bkrepo.example.com/%s/%s"
    - name: helm
      type: HELM
      isPublic: false
      description: "蓝鲸服务治理 helm charts 仓库"
      # Helm 仓库管理 URL，用于推送 HelmChart，与 HelmRepoURL 不同无法通过该 URL 下载
      endpointTmpl: "http://helm.bkrepo.example.com/api/%s/%s/charts"
# 蓝鲸监控 apm 配置
bkMonitor:
  # 旧版 bkmonitorv3 网关地址，供存量接口使用
  endpoint: "https://bkmonitorv3.apigw.example.com"
  # 新版 bk-monitor 网关地址，供新增接口（如 user group）使用
  gatewayEndpoint: "https://bk-monitor.apigw.example.com"
  # 蓝鲸监控 APM 上报地址
  apmEndpoint: "bk-example.com:4317"
  # 蓝鲸监控 APM http 上报地址
  apmHttpEndpoint: "http://bk-example.com:4318"
  # 蓝鲸监控 APM 上报 Token
  apmToken: "masked"
  # 蓝鲸监控 APM 服务名称，为空时默认使用 bkms.${cobra 子命令名}（如 bkms.webserver、bkms.worker）
  apmServiceName: ""
# BSCP 服务配置，用于 app 配置管理功能
bscp:
  # BSCP sidecar watch 地址
  feedAddr: bscp.example.com
# Tx CMDB
cmdb:
  baseUrl: https://cmdb.example.com
  appID: <masked>
  appKey: <masked>
# ------------------------------ 基础设施依赖 ------------------------------
# 数据库相关配置
mongo:
  username: root
  password: masked
  host: 127.0.0.1
  port: 27017
  database: bkms_server
# Redis 相关配置，主要用于数据缓存
redis:
  host: 127.0.0.1
  port: 6379
  db: 0
  password: masked
  # 超时配置推荐使用默认值，如有需要也可自行配置
  # dialTimeout: 5
  # readTimeout: 2
  # writeTimeout: 2
# Asynq 通用异步任务框架配置
asynq:
  # 独立 Redis 连接配置
  redis:
    host: 127.0.0.1
    port: 6379
    db: 1
    password: masked
    # 超时配置推荐使用默认值，如有需要也可自行配置
    # dialTimeout: 5
    # readTimeout: 2
    # writeTimeout: 2
  # asynq server 并发 worker 数
  concurrency: 10
  # 默认队列名（任务未在代码中指定队列时的兜底）
  queue: default
  # 默认最大重试次数（任务未在代码中指定 maxRetry 时的兜底）
  maxRetry: 10
  # "进行中"固定重试的默认间隔（秒），任务未在代码中指定固定间隔时的兜底
  retryInterval: 5
# ------------------------------ 服务运行时 ------------------------------
# 业务 HTTP Server 配置
httpServer:
  # HTTP Server 监听地址
  address: 127.0.0.1
  # HTTP Server 监听端口
  port: 8080
  # 服务对外可访问的 HTTP 基址（不含路径），用于拼装蓝盾触发回调等外部可达 URL
  # 例如 https://bkms.example.com；未配置时不影响手动构建，但无法下发触发专用流水线
  # publicBaseURL: https://bkms.example.com
  # 以下超时相关字段均在 config 包内提供默认值，
  # 未显式指定时按默认值生效；如需覆盖，取消对应行注释并填入新值
  # 读取请求头超时时间，单位：秒（默认 10）
  # readHeaderTimeout: 10
  # 读写超时默认 65 秒，用于覆盖常见 60 秒业务或下游请求超时，并预留少量时间完成错误响应
  # 读取完整请求超时时间，单位：秒（默认 65）
  # readTimeout: 65
  # 写响应超时时间，单位：秒（默认 65）
  # writeTimeout: 65
  # Keep-Alive 空闲连接超时时间，单位：秒（默认 120）
  # idleTimeout: 120
  # 进程退出时等待 HTTP Server 优雅关闭的最长时间，单位：秒（默认 30）
  # shutdownTimeout: 30
# Prometheus Metrics Server 配置
metrics:
  # Metrics HTTP Server 监听端口
  port: 8081
# 日志配置
logging:
  # 日志级别，支持 debug、info、warn、warning、error
  level: info
  # 日志格式，支持 json 和 text
  handlerName: json
  # 日志输出目标列表，支持 stdout、stderr、file
  writers:
    - writerName: stdout
      writerConfig: {}
  # 可按需追加 file writer，同时写入标准输出和滚动日志文件。
  # file writer 配置说明：
  #  - filename 为日志文件路径；
  #  - maxSize 单位为 MB，表示单个日志文件最大大小；
  #  - maxBackups 单位为个，表示最多保留的旧日志文件数量；
  #  - maxAge 单位为天，表示旧日志文件最长保留时间；
  #  - compress 表示是否使用 gzip 压缩旧日志文件。
  # writers:
  #   - writerName: stdout
  #     writerConfig: {}
  #   - writerName: file
  #     writerConfig:
  #       filename: /app/logs/bkms-server.log
  #       maxSize: 100
  #       maxBackups: 10
  #       maxAge: 7
  #       compress: true
# 加密配置
encrypt:
  # 加密密钥（base64 编码）仅用于测试
  secret: masked
# ------------------------------ 业务功能配置 ------------------------------
# 集群插件（Addon）配置
clusterAddons:
  # 内置集群 Addon 定义文件目录路径，为空则跳过加载
  builtinAddonDir: /app/assets/addons
  # 定义用于存储插件 Chart 的 Helm 仓库地址，目前所有 Chart 存放在统一仓库下
  # Helm 仓库 URL
  helmRepoURL: http://helm.bkrepo.example.com/api/bkms/helm/charts
  # Helm 仓库用户名
  helmRepoUsername: bkms
  # Helm 仓库密码
  helmRepoPassword: <masked>
# Helm 相关配置
helm:
  # Helm, Helmify, Kustomize 等二进制下载基础 URL（流水线中使用，需拼接具体二进制名称）
  toolchainBaseURL: https://bkrepo.example.com/generic/bkms/public-assets/helm-toolchain
  # Helm 仓库 URL，用于添加为 HelmRepo 供 Helm SDK 下载 Chart 用
  builtinRepoURLTmpl: https://helm.bkrepo.example.com/helm/%s/helm
# 镜像构建相关配置
imageBuild:
  # 镜像构建工具链下载基础 URL（流水线中使用，需拼接具体工具名称）
  toolchainBaseURL: https://bkrepo.example.com/generic/bkms/public-assets/image-build-toolchain
# 轮询相关配置
taskPoller:
  # 部署状态
  deployStatus:
    # 超时时间（单位：秒）
    timeout: 1200
    # 轮询间隔（单位：秒）
    interval: 15
# ------------------------------ 开发环境专用 ------------------------------
# 开发环境专用配置
development:
  # 危险：允许通过请求头直接设置已认证用户，禁止在生产环境中开启。
  allowSetUserInHeader: false
  # 启用后权限管理器返回 stub 实现，总是通过所有鉴权请求；仅本地开发使用，禁止在生产环境中打开。
  useStubPerm: false
  # 启用后，数据库已执行更高 seq 的 migration 时，migrate up 会静默跳过而不报错；
  # 仅供测试环境使用（避免开发分支的高版本 migration 阻塞 main 发布），禁止在生产环境中打开。
  allowSkipNewerDBMigration: false
