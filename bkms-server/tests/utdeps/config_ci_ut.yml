# 本配置文件主要用在 CI 环境中，用于执行单元测试，其中的数据库等依赖均指向到 utdpes 所启动的默认服务。
#
# ------------------------------ 蓝鲸平台接入 ------------------------------
# 蓝鲸应用配置（可从开发者中心获取）
bkApp:
  # 应用 Code
  code: bkms
  # 应用 Secret
  secret: masked
# Account 用户账号认证与用户 Token 获取相关配置项集合
account:
  # AuthBaseURL 是 auth 服务的基础 URL，通常由蓝鲸网关服务提供，usertoken 令牌相关功能使用
  authBaseURL: http://apigw.example.com
  # LoginURL 是蓝鲸登录服务的基础 URL，auth 令牌认证、usertoken 拼接登录地址时会用到
  loginURL: http://login.example.com
# 蓝鲸平台地址配置
bkPlatUrls:
  # 蓝鲸网关 API 地址模板
  bkApiUrlTmpl: https://{api_name}.apigw.example.com
  # 组件 API 基础地址
  compApiBaseUrl: https://api.example.com
# 蓝鲸 API 环境配置
bkApiStages:
  # BSCP
  bscp: prod
  # BkCI
  bkci: prod
  # BCS
  bcs: prod
  # KubeInsight
  kubeinsight: prod
  # 蓝鲸监控
  bkmonitor: prod
  # DBM 数据库管理平台
  bkdbm: prod
# ------------------------------ 外部依赖服务（蓝鲸 SaaS & 公司系统） ------------------------------
# BCS 配置，由于管理 BCS 集群内的资源
bcs:
  baseUrl: https://bcs-api.example.com
  token: masked
# 蓝盾配置，用于项目初始化 & 流水线模板加载
bkci:
  # 流水线模板存放目录
  pipelineTmpl:
    baseDir: /app/assets/pipeline_templates
    # 流水线模板使用的构建机镜像标识，为空时由 bkci 模板加载逻辑决定默认值
    builderImageCode: "tlinux3_ci"
    # 流水线模板使用的构建机镜像版本，为空时由 bkci 模板加载逻辑决定默认值
    builderImageVersion: "2.*"
# 蓝盾制品库配置，用于项目 & 仓库初始化
bkrepo:
  baseUrl: https://bkrepo.example.com
  # 管理账号配置，需由制品库管理员提供
  username: bkms
  password: <masked>
  # 仓库初始化配置
  initRepos:
    - name: repo
      type: DOCKER
      isPublic: false
      description: "蓝鲸服务治理 docker 镜像源仓库"
      endpointTmpl: "docker.bkrepo.example.com/%s/%s"
    - name: helm
      type: HELM
      isPublic: false
      description: "蓝鲸服务治理 helm charts 仓库"
      endpointTmpl: "http://helm.bkrepo.example.com/api/%s/%s/charts"
# 蓝鲸监控 apm 配置
bkMonitor:
  # 旧版 bkmonitorv3 网关地址，供存量接口使用
  endpoint: "https://bkmonitorv3.apigw.example.com"
  # 新版 bk-monitor 网关地址，供新增接口（如 user group）使用
  gatewayEndpoint: "https://bk-monitor.apigw.example.com"
  # 蓝鲸监控 APM 上报地址
  apmEndpoint: "bk-example.com:4317"
  # 蓝鲸监控 APM http 上报地址
  apmHttpEndpoint: "http://bk-example.com:4318"
  # 蓝鲸监控 APM 上报 Token
  apmToken: "masked"
  # 蓝鲸监控 APM 服务名称，为空时默认使用 bkms.${cobra 子命令名}（如 bkms.webserver、bkms.worker）
  apmServiceName: ""
# BSCP 服务配置，用于 app 配置管理功能
bscp:
  # BSCP sidecar watch 地址
  feedAddr: bscp.example.com
# ------------------------------ 基础设施依赖 ------------------------------
# 数据库相关配置
mongo:
  username: root
  password: utdepspass
  host: mongo_main
  port: 27017
  database: bkms
# Redis 相关配置，主要用于数据缓存
redis:
  host: redis
  port: 6379
  db: 8
  password: utdepspass
# RabbitMQ 相关配置，用于异步任务
rabbitmq:
  host: rabbitmq
  port: 5672
  username: admin
  password: utdepspass
  vhost: bkms-server
  # 消息队列名称
  queue: bkms-server.worker.async-task
  # 消费者预取数量，控制并发处理数
  prefetch: 25
# Asynq 通用异步任务框架配置
asynq:
  redis:
    host: redis
    port: 6379
    db: 9
    password: utdepspass
  concurrency: 10
  queue: default
  maxRetry: 10
  retryInterval: 5
# ------------------------------ 服务运行时 ------------------------------
# 业务 HTTP Server 配置
httpServer:
  address: 0.0.0.0
  port: 32402
  # 服务对外可访问的 HTTP 基址（不含路径），用于拼装蓝盾触发回调等外部可达 URL
  publicBaseURL: http://127.0.0.1:32402
  # 以下超时相关字段均在 config 包内提供默认值，
  # 未显式指定时按默认值生效；如需覆盖，取消对应行注释并填入新值
  # readHeaderTimeout: 10
  # readTimeout: 65
  # writeTimeout: 65
  # idleTimeout: 120
  # shutdownTimeout: 30
# Prometheus Metrics Server 配置
metrics:
  # Metrics HTTP Server 监听端口
  port: 8081
# 加密配置
encrypt:
  # 加密密钥（base64 编码）仅用于测试
  secret: 15RQgSBLUfCBjhcGzzFQu5WScClbSVrVzoEkWbJJhB4=
# ------------------------------ 业务功能配置 ------------------------------
# 轮询相关配置
taskPoller:
  # 部署状态
  deployStatus:
    # 超时时间（单位：秒）
    timeout: 1200
    # 轮询间隔（单位：秒）
    interval: 15
# ------------------------------ 开发环境专用 ------------------------------
development:
  allowSetUserInHeader: false
  useStubBkCI: true
  useStubBkRepo: true
  useStubPerm: true
  useStubBkHCM: true
  useStubBkCMDB: true
  useStubBCS: true
  useStubBSCP: true
  useStubDBM: true
  useStubBkMonitor: true
  useStubKubeInsight: true
