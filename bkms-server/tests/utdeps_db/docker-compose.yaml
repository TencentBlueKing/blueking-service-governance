services:
  mongo_main:
    image: "mongo:8.0.9"
    privileged: true
    volumes:
      - ./mongo8:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-utdepspass}
  redis:
    image: "redis:7.4.5"
    privileged: true
    command: redis-server --requirepass ${REDIS_PASSWORD:-utdepspass}
  etcd:
    image: 'quay.io/coreos/etcd:v3.5.15'
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
networks:
  default:
    name: ${NETWORK_NAME}
    external: true
