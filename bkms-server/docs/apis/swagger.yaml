basePath: /v1
definitions:
  admin.RoleCode:
    enum:
    - admin
    type: string
    x-enum-varnames:
    - RoleCodeAdmin
  bkerrs.ErrCode:
    enum:
    - INVALID_ARGUMENT
    - INVALID_REQUEST
    - UNAUTHENTICATED
    - IAM_NO_PERMISSION
    - NO_PERMISSION
    - NOT_FOUND
    - ALREADY_EXISTS
    - ABORTED
    - RATE_LIMIT_EXCEEDED
    - RESOURCE_EXHAUSTED
    - INTERNAL_ERROR
    - INTERNAL_SERVER_ERROR
    - NOT_IMPLEMENTED
    type: string
    x-enum-varnames:
    - ErrCodeInvalidArgument
    - ErrCodeInvalidRequest
    - ErrCodeUnauthenticated
    - ErrCodeIAMNoPermission
    - ErrCodeNoPermission
    - ErrCodeNotFound
    - ErrCodeAlreadyExists
    - ErrCodeAborted
    - ErrCodeRateLimitExceeded
    - ErrCodeResourceExhausted
    - ErrCodeInternalError
    - ErrCodeInternalServerError
    - ErrCodeNotImplemented
  bkerrs.GinError:
    properties:
      code:
        $ref: '#/definitions/bkerrs.ErrCode'
      details:
        items:
          additionalProperties: {}
          type: object
        type: array
      message:
        type: string
      module:
        type: string
      system:
        type: string
    type: object
  bkerrs.GinErrorOutput:
    properties:
      error:
        $ref: '#/definitions/bkerrs.GinError'
    type: object
  bkhcm.Filter:
    properties:
      op:
        type: string
      rules:
        items:
          $ref: '#/definitions/bkhcm.FilterRule'
        type: array
    type: object
  bkhcm.FilterRule:
    properties:
      field:
        type: string
      op:
        type: string
      value: {}
    type: object
  bkhcm.Page:
    properties:
      count:
        type: boolean
      limit:
        type: integer
      order:
        type: string
      sort:
        type: string
      start:
        type: integer
    type: object
  bkmonitor.ActionNotice:
    properties:
      notify_config:
        description: NotifyConfig 通知配置
        items:
          $ref: '#/definitions/bkmonitor.ActionNoticeConfig'
        type: array
      time_range:
        description: TimeRange 生效时间范围
        type: string
    type: object
  bkmonitor.ActionNoticeConfig:
    properties:
      notice_ways:
        description: NoticeWays 通知方式
        items:
          $ref: '#/definitions/bkmonitor.NoticeWay'
        type: array
      phase:
        description: Phase 阶段：1(失败时)，2(成功时)，3(执行前)
        type: integer
      type:
        description: Type 通知场景类型列表（如 normal / ack / resolved / closed，空数组表示全部）
        items:
          type: string
        type: array
    type: object
  bkmonitor.AlertNotice:
    properties:
      notify_config:
        description: NotifyConfig 通知配置
        items:
          $ref: '#/definitions/bkmonitor.AlertNoticeConfig'
        type: array
      time_range:
        description: TimeRange 生效时间范围
        type: string
    type: object
  bkmonitor.AlertNoticeConfig:
    properties:
      level:
        description: Level 告警级别：1(致命)，2(预警)，3(提醒)
        type: integer
      notice_ways:
        description: NoticeWays 通知方式
        items:
          $ref: '#/definitions/bkmonitor.NoticeWay'
        type: array
      type:
        description: Type 通知场景类型列表（如 normal / ack / resolved / closed，空数组表示全部）
        items:
          type: string
        type: array
    type: object
  bkmonitor.DutyArrange:
    properties:
      backups:
        description: Backups 备份人员
        items:
          additionalProperties: {}
          type: object
        type: array
      duty_rule_id:
        description: |-
          DutyRuleID 轮值规则ID。
          使用指针是为了：无值时序列化为 null（bkmonitor 读接口常回传 null，
          写接口也要求未设置时传 null 而非 0）。
        type: integer
      duty_time:
        description: DutyTime 轮班时间安排
        items:
          additionalProperties: {}
          type: object
        type: array
      duty_users:
        description: DutyUsers 值班人员组
        items:
          items:
            $ref: '#/definitions/bkmonitor.UserGroupUser'
          type: array
        type: array
      effective_time:
        description: |-
          EffectiveTime 生效时间。
          使用指针是为了：无值时序列化为 null（bkmonitor 读接口可能回传 null 或空串，
          写接口未设置时需要传 null）。
        type: string
      group_number:
        description: "GroupNumber \t自动分组时每个班次对应的人数"
        type: integer
      group_type:
        description: GroupType 分组类型，可选项 specified(指定), auto(自动)
        type: string
      handoff_time:
        additionalProperties: {}
        description: HandoffTime 交接班时间配置
        type: object
      hash:
        description: Hash 原始配置摘要
        type: string
      id:
        description: ID 轮值 ID
        type: integer
      need_rotation:
        description: NeedRotation 是否需要交接班
        type: boolean
      order:
        description: Order 排序
        type: integer
      user_group_id:
        description: UserGroupID 告警组 ID
        type: integer
      users:
        description: Users 值班人员（兼容老接口，不需要轮值的时候可以保留该字段）
        items:
          $ref: '#/definitions/bkmonitor.UserGroupUser'
        type: array
    type: object
  bkmonitor.DutyNotice:
    properties:
      hit_first_duty:
        description: |-
          HitFirstDuty 是否命中首班。
          使用指针 + omitempty 是为了：未配置时序列化时完全省略该字段，
          避免 bkmonitor 写接口在未设置时收到 false 产生歧义。
        type: boolean
      personal_notice:
        additionalProperties: {}
        description: PersonalNotice 值班人员通知配置，未配置时不展示该字段
        type: object
      plan_notice:
        additionalProperties: {}
        description: PlanNotice 轮值计划通知配置，未配置时不展示该字段
        type: object
    type: object
  bkmonitor.NoticeWay:
    properties:
      name:
        description: Name 通知方式名称，如 weixin、sms、voice、wxwork-bot
        type: string
      receivers:
        description: Receivers 通知接收人员：企业微信机器人为 chatID，bkchat 为对应的选项 ID
        items:
          type: string
        type: array
    type: object
  bkmonitor.UserGroup:
    properties:
      bk_biz_id:
        description: BkBizID 业务 ID
        type: integer
      channels:
        description: Channels 通知渠道，可选项 user(内部用户)、wxwork-bot(企业微信机器人)
        items:
          type: string
        type: array
      config_source:
        description: ConfigSource 配置来源
        type: string
      delete_allowed:
        description: DeleteAllowed 是否可删除
        type: boolean
      desc:
        description: Desc 说明
        type: string
      edit_allowed:
        description: EditAllowed 是否可编辑
        type: boolean
      id:
        description: ID 告警组 ID
        type: integer
      mention_list:
        description: MentionList 提及人列表（企业微信机器人等渠道会 @ 这些人）
        items:
          $ref: '#/definitions/bkmonitor.UserGroupUser'
        type: array
      mention_type:
        description: MentionType 提及类型：0-不提及，1-提及全部，2-按 MentionList 提及
        type: integer
      name:
        description: Name 名称
        type: string
      need_duty:
        description: NeedDuty 是否轮值
        type: boolean
      strategy_count:
        description: StrategyCount 关联的告警策略数量
        type: integer
      timezone:
        description: Timezone 时区
        type: string
      users:
        description: Users 通知接收人员
        items:
          $ref: '#/definitions/bkmonitor.UserGroupUser'
        type: array
    type: object
  bkmonitor.UserGroupDetail:
    properties:
      action_notice:
        description: ActionNotice 告警处理通知配置
        items:
          $ref: '#/definitions/bkmonitor.ActionNotice'
        type: array
      alert_notice:
        description: AlertNotice 告警通知方式
        items:
          $ref: '#/definitions/bkmonitor.AlertNotice'
        type: array
      bk_biz_id:
        description: BkBizID 业务 ID
        type: integer
      channels:
        description: Channels 通知渠道，可选项 user(内部用户)、wxwork-bot(企业微信机器人)
        items:
          type: string
        type: array
      config_source:
        description: ConfigSource 配置来源
        type: string
      delete_allowed:
        description: DeleteAllowed 是否可删除
        type: boolean
      desc:
        description: Desc 说明
        type: string
      duty_arranges:
        description: DutyArranges 轮值安排
        items:
          $ref: '#/definitions/bkmonitor.DutyArrange'
        type: array
      duty_notice:
        allOf:
        - $ref: '#/definitions/bkmonitor.DutyNotice'
        description: DutyNotice 轮值通知设置
      duty_rules:
        description: DutyRules 轮值规则
        items:
          type: integer
        type: array
      edit_allowed:
        description: EditAllowed 是否可编辑
        type: boolean
      id:
        description: ID 告警组 ID
        type: integer
      mention_list:
        description: MentionList 提及人列表（企业微信机器人等渠道会 @ 这些人）
        items:
          $ref: '#/definitions/bkmonitor.UserGroupUser'
        type: array
      mention_type:
        description: MentionType 提及类型：0-不提及，1-提及全部，2-按 MentionList 提及
        type: integer
      name:
        description: Name 名称
        type: string
      need_duty:
        description: NeedDuty 是否轮值
        type: boolean
      path:
        description: Path 业务路径
        type: string
      strategy_count:
        description: StrategyCount 关联的告警策略数量
        type: integer
      timezone:
        description: Timezone 时区
        type: string
      users:
        description: Users 通知接收人员
        items:
