  serializer.GPAStatusOutput:
    properties:
      currentReplicas:
        description: 当前副本数
        type: integer
      desiredReplicas:
        description: 期望副本数
        type: integer
      lastScaleTime:
        description: 上次扩缩容时间（RFC3339 字符串，可能为空）
        type: string
      phase:
        description: |-
          Phase 提炼后的扩缩容健康状态枚举：
            Active       - 扩缩正常运作，副本数在 min/max 范围内
            Paused       - 指标获取失败或无效，扩缩被暂停
            Limited      - 扩缩逻辑正常但已触达 min/max 边界
            Failed       - 无法访问 scale 子资源（目标工作负载不存在、API 不可达、权限不足等）
            Initializing - CR 刚下发，controller 尚未写入 status.conditions，属正常过渡态，稍候即会转为其他状态
            Unknown      - conditions 存在但关键 condition 无法解析（旧版本 GPA 或异常状态）
        type: string
      statusMessage:
        description: |-
          StatusMessage 汇总所有非 True condition 的 message，用 "; " 连接
          所有 condition 均为 True 时为空字符串
        type: string
    type: object
  serializer.GPATimeRangeInput:
    properties:
      desiredReplicas:
        description: 命中时间段时的期望副本数（>= 1）
        minimum: 1
        type: integer
      enabled:
        description: |-
          是否启用该定时规则。仅启用的规则会下发到底层 K8s CR。
          不传时默认为 true（启用）。
        type: boolean
      remark:
        description: 备注说明，仅用于展示，最长 256 字符。
        maxLength: 256
        type: string
      schedule:
        description: |-
          标准 5 段 Crontab 表达式（分 时 日 月 周）。
          语法合法性由领域层校验。
        type: string
    required:
    - desiredReplicas
    - schedule
    type: object
  serializer.GPATimeRangeOutput:
