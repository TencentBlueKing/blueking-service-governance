name: bkms-ui unit tests

on:
  pull_request:
    paths:
      - 'bkms-ui/**'
      - '.github/workflows/bkms-ui-test.yml'
  push:
    branches: [main, develop]
    paths:
      - 'bkms-ui/**'
      - '.github/workflows/bkms-ui-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # 从 bkms-ui/package.json 的 packageManager 字段读取 pnpm 版本
          package_json_file: bkms-ui/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: bkms-ui/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: bkms-ui
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        working-directory: bkms-ui
        run: pnpm test:ci
