name: Release bkms-cli

on:
  push:
    tags:
      - "bkms-cli/v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bkms-cli/go.mod
          cache-dependency-path: bkms-cli/go.sum

      - name: Test bkms-cli packages
        working-directory: bkms-cli
        run: make test

      - name: Derive version
        run: |
          ver="${GITHUB_REF_NAME##*/}"
          echo "VERSION=${ver#v}" >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "v2.17.1"
          args: release --clean --skip=validate --config bkms-cli/.goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_SOURCE: ${{ github.repository }}
