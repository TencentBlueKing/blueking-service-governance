name: Release bkms-cli

on:
  push:
    tags:
      - "bkms-cli/v*.*.*"

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bkms-cli/go.mod
          cache-dependency-path: bkms-cli/go.sum

      - name: Test bkms-cli packages
        working-directory: bkms-cli
        run: make test

      - name: Derive version
        run: |
          ver="${GITHUB_REF_NAME##*/}"
          echo "VERSION=${ver#v}" >> "$GITHUB_ENV"

      - name: Verify npm package version matches tag
        run: |
          pkg_ver="$(node -p "require('./bkms-cli/npm/package.json').version")"
          if [ "${pkg_ver}" != "${VERSION}" ]; then
            echo "package.json version (${pkg_ver}) does not match tag (${VERSION})" >&2
            exit 1
          fi

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          args: --current --strip header --tag ${{ github.ref_name }} --topo-order
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: ${{ runner.temp }}/RELEASE_NOTES.md

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "v2.17.1"
          args: release --clean --skip=validate --config bkms-cli/.goreleaser.yaml --release-notes ${{ runner.temp }}/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_SOURCE: ${{ github.repository }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org

      - name: Publish npm package
        working-directory: bkms-cli/npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
