# git-cliff configuration for bkms-cli (monorepo subdirectory)
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog\n
All notable changes to bkms-cli will be documented in this file.\n
"""
body = """
{%- macro remote_url() -%}
  https://github.com/TencentBlueKing/blueking-service-governance
{%- endmacro -%}

{% if version -%}
    ## [{{ version | replace(from="bkms-cli/", to="") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
            {{ commit.message }}\
            {%- if commit.breaking %} [**breaking**]{% endif %} \
            ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))\
    {%- endfor %}
{% endfor %}

{% if previous.version -%}
**Full Changelog**: {{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }}
{% endif -%}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "Miscellaneous" },
    { message = "^ci", group = "CI" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "bkms-cli/v[0-9].*"
sort_commits = "oldest"
include_paths = ["bkms-cli/"]
